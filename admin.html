<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <h2>Admin Panel</h2>
        <button id="logout-btn">Logout</button>
    </header>
    <main>
        <section class="panel">
            <h3>Manage Categories</h3>
            <form id="cat-form">
                <input type="text" id="cat-name" placeholder="Category Name (e.g. Roll)" required>
                <button type="submit" id="cat-submit-btn">Add Category</button>
            </form>
            <ul id="cat-list"></ul>
        </section>
        <section class="panel">
            <h3>Add / Edit Item</h3>
            <form id="item-form">
                <select id="item-category" required>
                    <option value="">Select Category...</option>
                </select>
                <input type="text" id="item-name" placeholder="Item Name" required>
                <input type="text" id="item-price" placeholder="Price (e.g. 10 or 10,20)" required>
                <button type="submit" id="add-item-btn">Add Item</button>
            </form>
            <h3>Manage Items</h3>
            <div id="admin-items-list"></div>
        </section>
    </main>
    <script type="module" src="admin.js"></script>
</body>
</html>
