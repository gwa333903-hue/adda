<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <h2>Admin Panel</h2>
        <button id="logout-btn">Logout</button>
    </header>
    <main>
        <section class="panel">
            <h3>Manage Categories</h3>
            <form id="cat-form">
                <input type="text" id="cat-name" placeholder="Category Name (e.g. Roll)" required>
                <input type="number" id="cat-order" placeholder="Position/Order (e.g. 1, 2, 3)" required>
                <button type="submit" id="cat-submit-btn">Add Category</button>
            </form>
            <ul id="cat-list"></ul>
        </section>
        <section class="panel">
            <h3>Add New Item</h3>
            <form id="item-form">
                <select id="item-category" required>
                    <option value="">Select Category...</option>
                </select>
                <input type="text" id="item-name" placeholder="Item Name" required>
                <input type="text" id="item-price" placeholder="Price (e.g. 10 or 10,20)" required>
                <button type="submit" id="add-item-btn">Add Item</button>
            </form>
            <h3>Manage Items</h3>
            <div id="admin-items-list"></div>
        </section>
    </main>

    <!-- Modal for Renaming Items -->
    <div id="rename-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Rename Item & Prices</h3>
            <input type="text" id="modal-item-name" placeholder="Item Name">
            <input type="text" id="modal-item-price" placeholder="Prices (e.g. 10,20)">
            <div class="modal-buttons">
                <button id="save-rename-btn">Save</button>
                <button id="cancel-rename-btn" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for Moving Items -->
    <div id="move-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Move Item to Category</h3>
            <select id="modal-target-category"></select>
            <div class="modal-buttons">
                <button id="save-move-btn">Move</button>
                <button id="cancel-move-btn" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
