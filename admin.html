<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <h2>Admin Panel</h2>
        <button id="logout-btn">Logout</button>
    </header>
    <main>
        <section class="panel">
            <h3>Manage Categories</h3>
            <form id="cat-form">
                <input type="text" id="cat-name" placeholder="Category Name (e.g. Roll)" required>
                <input type="number" id="cat-order" placeholder="Position/Order (e.g. 1, 2, 3)" required>
                <button type="submit" id="cat-submit-btn">Add Category</button>
            </form>
            <ul id="cat-list"></ul>
        </section>
        <section class="panel">
            <h3>Add New Item</h3>
            <form id="item-form">
                <select id="item-category" required>
                    <option value="">Select Category...</option>
                </select>
                <input type="text" id="item-name" placeholder="Item Name" required>
                <input type="text" id="item-price" placeholder="Price (e.g. 10 or 10,20)" required>
                <input type="number" id="item-order" placeholder="Item Position (e.g. 1, 2, 3)" required>
                <button type="submit" id="add-item-btn">Add Item</button>
            </form>
            <h3>Manage Items</h3>
            <div id="admin-items-list"></div>
        </section>
    </main>

    <!-- Modal for Renaming Items -->
    <div id="rename-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Rename Item & Prices</h3>
            <input type="text" id="modal-item-name" placeholder="Item Name">
            <input type="text" id="modal-item-price" placeholder="Prices (e.g. 10,20)">
            <div class="modal-buttons">
                <button id="save-rename-btn">Save</button>
                <button id="cancel-rename-btn" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for Moving Items to another Category -->
    <div id="move-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Move Item to Category</h3>
            <select id="modal-target-category"></select>
            <div class="modal-buttons">
                <button id="save-move-btn">Move Cat.</button>
                <button id="cancel-move-btn" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for Moving Category Position -->
    <div id="move-cat-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Change Category Position</h3>
            <label style="font-size: 13px; color: #666;">Select new position number:</label>
            <select id="modal-target-position">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option>
            </select>
            <div class="modal-buttons">
                <button id="save-cat-move-btn">Update Position</button>
                <button id="cancel-cat-move-btn" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for Moving Item Position -->
    <div id="move-item-pos-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Change Item Position</h3>
            <label style="font-size: 13px; color: #666;">Select new position number:</label>
            <select id="modal-item-target-position">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                <option value="13">13</option><option value="14">14</option><option value="15">15</option>
                <option value="16">16</option><option value="17">17</option><option value="18">18</option>
                <option value="19">19</option><option value="20">20</option>
            </select>
            <div class="modal-buttons">
                <button id="save-item-pos-btn">Update Position</button>
                <button id="cancel-item-pos-btn" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
